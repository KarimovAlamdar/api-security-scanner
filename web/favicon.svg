<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Linear Gradient for Shield (Neon Emerald -> Cyber Cyan -> Electric Indigo) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Highlight Overlay for 3D Cyber Shimmer -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Star Core Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Subtle drop shadow / glow filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00f5a0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Protective Cyber Shield Base -->
  <path d="M32 6 
           C42 6, 51 9, 53 12 
           C54 26, 49 43, 32 58 
           C15 43, 10 26, 11 12 
           C13 9, 22 6, 32 6 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#iconGlow)"/>

  <!-- Specular 3D Shimmer Overlay -->
  <path d="M32 6 
           C42 6, 51 9, 53 12 
           C54 26, 49 43, 32 58 
           C15 43, 10 26, 11 12 
           C13 9, 22 6, 32 6 Z" 
        fill="url(#highlightGrad)"/>

  <!-- Inner Dark Core Well for Ultra-High Contrast -->
  <path d="M32 13 
           C39 13, 44 15, 45 17 
           C46 27, 42 39, 32 49 
           C22 39, 18 27, 19 17 
           C20 15, 25 13, 32 13 Z" 
        fill="#070b16" 
        opacity="0.55"/>

  <!-- 4-Pointed Security Spark / Radar Pulse (Gemini-style brilliance) -->
  <path d="M32 18 
           Q32 28, 42 28 
           Q32 28, 32 38 
           Q32 28, 22 28 
           Q32 28, 32 18 Z" 
        fill="url(#starGrad)"/>

  <!-- Scanning Ring Accent -->
  <circle cx="32" cy="28" r="2" fill="#00f5a0"/>
  <circle cx="32" cy="28" r="6" fill="none" stroke="#00f5a0" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
</svg>
