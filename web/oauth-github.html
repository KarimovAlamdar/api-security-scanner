<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize API Security Scanner &middot; GitHub</title>
    <link rel="icon" type="image/svg+xml" href="https://github.githubassets.com/favicons/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=-apple-system,BlinkMacSystemFont,Segoe+UI,Helvetica,Arial,sans-serif&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .loading-bar {
            height: 3px;
            width: 100%;
            background-color: #21262d;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            display: none;
            z-index: 1000;
        }

        .loading-bar-inner {
            height: 100%;
            background-color: #238636;
            width: 50%;
            animation: indeterminate 1.2s infinite ease-in-out;
        }

        @keyframes indeterminate {
            0% { transform: translateX(-100%) scaleX(0.2); }
            50% { transform: translateX(20%) scaleX(0.6); }
            100% { transform: translateX(200%) scaleX(0.2); }
        }

        .oauth-card {
            max-width: 440px;
            width: 100%;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* Logos row */
        .logos-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .gh-logo-box, .app-logo-box {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #30363d;
            background: #0d1117;
        }

        .app-logo-box {
            background: linear-gradient(135deg, #090d16, #121a2d);
            border-color: rgba(0, 245, 160, 0.4);
        }

        .link-icon {
            color: #7d8590;
        }

        .oauth-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .oauth-subtitle {
            font-size: 13px;
            color: #7d8590;
            margin-bottom: 24px;
        }

        .oauth-subtitle strong {
            color: #e6edf3;
        }

        /* Account profile card */
        .account-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .account-box:hover {
            border-color: #58a6ff;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #238636, #1f6feb);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #e6edf3;
        }

        .user-handle {
            font-size: 12px;
            color: #7d8590;
        }

        .scope-list {
            text-align: left;
            font-size: 12px;
            color: #7d8590;
            margin-bottom: 24px;
            border-top: 1px solid #21262d;
            padding-top: 14px;
        }

        .scope-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
            color: #c9d1d9;
        }

        .btn-authorize {
            width: 100%;
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-authorize:hover {
            background-color: #2ea043;
        }

        .btn-cancel {
            width: 100%;
            background-color: transparent;
            color: #7d8590;
            border: none;
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-cancel:hover {
            color: #f85149;
        }
    </style>
</head>
<body>
    <div class="loading-bar" id="loadingBar">
        <div class="loading-bar-inner"></div>
    </div>

    <div class="oauth-card">
        <!-- Logos -->
        <div class="logos-row">
            <div class="gh-logo-box">
                <svg height="28" viewBox="0 0 16 16" width="28" fill="#ffffff" aria-hidden="true">
                    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
                </svg>
            </div>
            <div class="link-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </div>
            <div class="app-logo-box">
                <svg width="26" height="26" viewBox="0 0 64 64">
                    <path d="M32 6 C42 6, 51 9, 53 12 C54 26, 49 43, 32 58 C15 43, 10 26, 11 12 C13 9, 22 6, 32 6 Z" fill="#00f5a0"/>
                    <circle cx="32" cy="28" r="4" fill="#090d16"/>
                </svg>
            </div>
        </div>

        <h1 class="oauth-title">Authorize API Security Scanner</h1>
        <div class="oauth-subtitle">by <strong>KarimovAlamdar</strong> wants to access your GitHub account</div>

        <!-- Account -->
        <div class="account-box">
            <div class="user-avatar">AK</div>
            <div>
                <div class="user-name">Ələmdar Kərimov</div>
                <div class="user-handle">@KarimovAlamdar &middot; ekerimov2025@std.beu.edu.az</div>
            </div>
        </div>

        <!-- Scopes -->
        <div class="scope-list">
            <div class="scope-item">
                <span>&#10003;</span>
                <span>Verify your GitHub identity (public profile)</span>
            </div>
            <div class="scope-item">
                <span>&#10003;</span>
                <span>Access security scanning workspace &amp; automated pull request triggers</span>
            </div>
        </div>

        <!-- Actions -->
        <button class="btn-authorize" onclick="authorizeGithub()">
            Authorize API Security Scanner &rarr;
        </button>
        <button class="btn-cancel" onclick="window.close()">Cancel</button>
    </div>

    <script>
        function authorizeGithub() {
            document.getElementById('loadingBar').style.display = 'block';

            const payload = {
                type: 'OAUTH_SUCCESS',
                provider: 'github',
                name: 'Ələmdar Kərimov',
                email: 'ekerimov2025@std.beu.edu.az'
            };

            try {
                localStorage.setItem('scanner_last_oauth_payload', JSON.stringify(payload));
            } catch (err) {}

            setTimeout(() => {
                if (window.opener && !window.opener.closed) {
                    try {
                        window.opener.postMessage(payload, '*');
                    } catch (e) {}
                    window.close();
                } else if (window.parent && window.parent !== window) {
                    try {
                        window.parent.postMessage(payload, '*');
                    } catch (e) {}
                } else {
                    window.location.href = 'index.html?oauth_success=true';
                }
            }, 500);
        }
    </script>
</body>
</html>
