name: API Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # lets the scanner post its findings as a PR comment

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run API Security Scanner
        uses: ./
        with:
          spec: openapi.json
          base-url: https://staging.example.com      # must be reachable from the runner
          auth-token: ${{ secrets.API_TOKEN }}
          methods: GET                               # read-only scan; add POST,PUT,DELETE only on a test system
          fail-on: high
