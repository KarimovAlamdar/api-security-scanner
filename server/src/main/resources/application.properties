# ==============================================================================
# API Security Scanner - Global Billing & Licensing Server Configuration
# ==============================================================================

# Server Port (Default: 4242)
server.port=4242

# Active Payment Provider:
# "lemonsqueezy" -> Variant A (Merchant of Record, Payouts to Wise / Payoneer / Bank Card)
# "stripe"       -> Variant B (Stripe Checkout direct)
billing.provider=lemonsqueezy

# ------------------------------------------------------------------------------
# Lemon Squeezy (Variant A - Recommended for Global SaaS Payouts)
# Dashboard: https://app.lemonsqueezy.com/settings/api
# ------------------------------------------------------------------------------
lemonsqueezy.api.key=ls_apikey_placeholder_replace_with_your_key
lemonsqueezy.store.id=store_placeholder_12345
lemonsqueezy.webhook.secret=ls_whsec_placeholder_replace_with_your_secret

# Lemon Squeezy Variant IDs for your products:
lemonsqueezy.variant.starter=variant_placeholder_starter
lemonsqueezy.variant.pro=variant_placeholder_pro
lemonsqueezy.variant.enterprise=variant_placeholder_enterprise

# ------------------------------------------------------------------------------
# Stripe (Variant B - Alternative direct provider)
# ------------------------------------------------------------------------------
stripe.secret.key=sk_test_placeholder_replace_with_your_stripe_secret_key
stripe.publishable.key=pk_test_placeholder_replace_with_your_stripe_publishable_key
stripe.webhook.secret=whsec_placeholder_replace_with_your_stripe_webhook_secret

# Default Frontend URL
app.frontend.url=http://localhost:3000

# License Key HMAC Secret (Used for offline signature validation)
license.secret.key=api-security-scanner-secret-hmac-key-2026
